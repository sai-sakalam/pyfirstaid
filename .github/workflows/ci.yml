name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: python -m pytest -q
      - name: Run pyfirstaid on the CI machine (report only)
        shell: bash
        run: python -m pyfirstaid || true

  pyz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build single-file pyfirstaid.pyz
        run: python scripts/build_pyz.py
      - name: Smoke test
        run: python dist/pyfirstaid.pyz --offline || true
      - uses: actions/upload-artifact@v4
        with:
          name: pyfirstaid.pyz
          path: dist/pyfirstaid.pyz
