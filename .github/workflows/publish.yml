name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach pyfirstaid.pyz to"
        required: true
        default: "v0.1.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package (wheel + sdist)
        run: |
          python -m pip install build
          python -m build

      - name: Build single-file pyfirstaid.pyz (kept OUT of dist/)
        run: |
          python scripts/build_pyz.py
          mkdir -p pyz-out
          mv dist/pyfirstaid.pyz pyz-out/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Attach pyfirstaid.pyz to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" pyz-out/pyfirstaid.pyz --clobber
