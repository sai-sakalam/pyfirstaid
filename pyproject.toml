[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyfirstaid"
dynamic = ["version"]
description = "First aid for broken Python environments: finds what's wrong and tells you how to fix it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Sai Gavaskar Sakalam" }]
keywords = ["pip", "virtualenv", "venv", "diagnostics", "troubleshooting", "ssl", "environment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Installation/Setup",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
pyfirstaid = "pyfirstaid.cli:main"

[project.urls]
Homepage = "https://github.com/sai-sakalam/pyfirstaid"
Source = "https://github.com/sai-sakalam/pyfirstaid"
Issues = "https://github.com/sai-sakalam/pyfirstaid/issues"
Changelog = "https://github.com/sai-sakalam/pyfirstaid/blob/main/CHANGELOG.md"
Author = "https://sai-sakalam.github.io/"

[tool.hatch.version]
path = "src/pyfirstaid/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyfirstaid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
